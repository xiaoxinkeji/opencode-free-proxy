services:
  proxy:
    image: ghcr.io/xiaoxinkeji/opencode-free-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-proxy
    ports:
      - "${PROXY_PORT:-6446}:6446"
    env_file:
      - path: .env
        required: false
    environment:
      KEYS_FILE: /app/data/api-keys.json
    volumes:
      - ./data:/app/data
    restart: unless-stopped
